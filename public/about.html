<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express Server with Nav Bar</title>
    <style>
      body {
        color: antiquewhite;
        font-family: Arial, sans-serif;
        background-color: darkorange;
      }
      nav {
        background-color: #333;
        overflow: hidden;
        margin-right: 960px;
      }
      nav a {
        float: left;
        display: block;
        color: #f2f2f2;
        text-align: center;
        padding: 140px 160px;
        text-decoration: none;
      }
      nav a:hover {
        background-color: #ddd;
        color: rgb(6, 6, 6);
      }
      .button-class {
			background-color: #4CAF50;
			/* Green */
			border: none;
			color: white;
			padding: 10px 20px;
			text-align: center;
			text-decoration: none;
			display: inline-block;
			font-size: 16px;
			margin: 4px 2px;
			cursor: pointer;
			border-radius: 4px;
		}
    
    </style>
  </head>
  <body>
    <nav>
      <a href="/" class="button-class">Home</a>
      <a href="/about" class="button-class">About</a>
    </nav>
    <div>
      <h1>This is the About Page.</h1>
    </div>
  </body>
</html>
